<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品・サービス | SAWZAN</title>
<meta name="description" content="SAWZANが手がけるアプリ・動画・音楽などの作品とサービスの一覧です。">
<meta name="theme-color" content="#F3EFE8">
<link rel="icon" href="../assets/sawzan_logo_primary.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
  /* 共通は assets/site.css。ここは作品ページ固有 */
  .wrap.page-head { padding-top: 152px; padding-bottom: 40px; }
  .eyebrow { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.3em; margin: 0 0 10px; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 800; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.3; letter-spacing: 0.06em; }
  .lead { margin: 22px 0 0; max-width: 34em; color: var(--muted); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 0; padding: 0; list-style: none; }
  .filters button { font: inherit; font-size: 0.9rem; letter-spacing: 0.08em; padding: 8px 18px; border: 1px solid var(--rule); background: transparent; color: var(--muted); border-radius: 999px; cursor: pointer; }
  .filters button:hover { color: var(--ink); border-color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .lineup { padding-top: 40px; }
  .group { margin: 0 0 72px; }
  .group-head { display: flex; align-items: baseline; gap: 16px; margin: 0 0 24px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .group-head h2 { margin: 0; font-family: var(--serif); font-weight: 800; font-size: 1.5rem; letter-spacing: 0.1em; }
  .group-head .en { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.26em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); overflow: hidden; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--bg-soft); display: grid; place-items: center; color: var(--muted); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 44px; height: 44px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
  .badge { position: absolute; top: 12px; left: 12px; font-size: 0.72rem; letter-spacing: 0.12em; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--ink); border: 1px solid var(--rule); }
  .badge.live { background: var(--brand); color: #fff; border-color: var(--brand); }
  .card-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h3 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 1.12rem; letter-spacing: 0.05em; line-height: 1.5; }
  .card p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.8; }
  .meta { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.8rem; }
  .go { margin-top: auto; padding-top: 12px; }
  .go a { display: inline-block; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.08em; padding: 9px 20px; border: 1px solid var(--accent); color: var(--accent); }
  .go a:hover { background: var(--accent); color: var(--bg); }

  .empty { grid-column: 1 / -1; border: 1px dashed var(--rule); padding: 36px 24px; text-align: center; color: var(--muted); }
  .empty strong { display: block; font-family: var(--serif); font-size: 1.05rem; color: var(--ink); letter-spacing: 0.1em; margin-bottom: 6px; }

  .demo-note { margin: 0 0 32px; padding: 14px 18px; border: 1px solid var(--brand); color: var(--ink); font-size: 0.9rem; }

  footer { margin-top: 40px; }

  @media (max-width: 640px) {
    .wrap.page-head { padding-top: 124px; }
    .grid { grid-template-columns: 1fr; }
    .group-head { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>

<!--SITE-HEADER-->
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../"><img src="../assets/sawzan_logo_primary.svg" alt="創山のロゴ" width="57" height="42"><span>SAWZAN</span></a>
    <nav aria-label="メニュー">
      <ul>
        <li><a href="../#business">事業内容</a></li>
        <li><a href="../#about">会社概要</a></li>
        <li><a href="../#history">沿革</a></li>
        <li><a href="../#contact">お問い合わせ</a></li>
        <li><a href="./" aria-current="page">作品・サービス<span aria-hidden="true"> →</span></a></li>
      </ul>
    </nav>
  </div>
</header>
<!--/SITE-HEADER-->

<main>
  <div class="wrap page-head">
    <p class="eyebrow">WORKS &amp; SERVICES</p>
    <h1>作品・サービス</h1>
    <p class="lead">SAWZANが手がけるアプリ、動画、音楽などを、ここにまとめていきます。公開できたものから、順に並べます。</p>
    <ul class="filters" id="filters" aria-label="種類で絞り込む"></ul>
  </div>

  <div class="wrap lineup">
    <div id="demo-note" class="demo-note" hidden>これは、デザインを確認するための<strong>サンプル表示</strong>です。実在する作品ではありません。</div>
    <div id="lineup"></div>
    <noscript><p class="empty"><strong>JavaScript が無効です</strong>作品の一覧を表示するには、JavaScript を有効にしてください。</p></noscript>
  </div>
</main>

<!--SITE-FOOTER-->
<footer>
  <div class="wrap">
    <span>&copy; 2026 SAWZAN</span>
    <a href="../koukoku/">電子公告</a>
  </div>
</footer>
<!--/SITE-FOOTER-->

<script src="../assets/works-data.js"></script>
<script src="../assets/works.js"></script>
</body>
</html>
